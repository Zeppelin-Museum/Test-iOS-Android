<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Viewer</title>

<script type="module" src=https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js></script>

<style>

html, body {

margin: 0;

width: 100%;

height: 100%;

overflow: hidden;

background: #ffffff;

font-family: Arial, sans-serif;

}

model-viewer {

width: 100%;

height: 100vh;

background-color: #ffffff;

}

#ar-button {

background: #0078d4;

color: white;

border: none;

border-radius: 8px;

padding: 14px 24px;

font-size: 16px;

font-weight: 600;

cursor: pointer;

box-shadow: 0 2px 8px rgba(0,0,0,0.2);

}

</style>

</head>

<body>

<model-viewer

src="assets/model.glb"

ios-src="assets/model.usdz"

ar

ar-modes="webxr scene-viewer quick-look"

ar-placement="floor"

camera-controls

shadow-intensity="1">

<button id="ar-button" slot="ar-button">

In AR ansehen<br>

View in AR

</button>

</model-viewer>

</body>

</html>
